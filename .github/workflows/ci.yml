name: Dashboard — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # nightly regression at 2 AM UTC

jobs:
  # ─── Unit & Component Tests ────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --watchAll=false --coverage --ci
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:3000/api

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-coverage
          path: coverage/
          retention-days: 7

  # ─── Build check ───────────────────────────────────────────────────────────
  # Ensures the React app produces a working production bundle.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build React app
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:3000/api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: build/
          retention-days: 3

  # ─── Nightly regression guard ─────────────────────────────────────────────
  # Re-runs on schedule (via cron above) to catch silent regressions
  # from dependency updates. Skipped on normal push/PR events.
  regression:
    name: Nightly regression run
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run full regression suite
        run: npm test -- --watchAll=false --ci
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:3000/api
